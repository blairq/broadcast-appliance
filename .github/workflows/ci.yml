# ============================================================================
# CI/CD — Broadcast Appliance Portable v2
#
# Usa los MISMOS targets de make que el desarrollo local: todo lo de terceros
# se descarga (con hash) o se compila desde fuente fijada dentro de extern/.
# extern/ se guarda en la cache de Actions (clave = hash de los pins), asi que
# solo la primera corrida compila FFmpeg/libobs y baja Qt/OBS/libwebrtc.
#
# Jobs:
#   1. lint        clang-format (version fijada en versions.cmake).
#   2. linux       deps completas + build + ctest + pytest + dist-linux
#                  (bundle portable verificado por check-portable.sh).
#   3. windows     cross desde Linux (clang-cl, ABI MSVC) + tests bajo Wine
#                  + dist-win (bundle verificado por check-portable-win.sh).
#   4. sanitizers  ASan/UBSan y TSan sobre la suite.
#   5. release     en cada push a master (y en tags v*) con todo en verde:
#                  publica el .tar.gz de Linux y el .zip de Windows (con sus
#                  .sha256) en un GitHub Release. En master el tag se arma
#                  solo: v<version de CMakeLists>-build.<numero de corrida>.
#
# Licencia de Microsoft: el job de Windows baja el CRT y el Windows SDK con
# xwin (BA_ACCEPT_MSVC_LICENSE=1), aceptando la licencia de Visual Studio
# Build Tools en nombre del dueño del repositorio.
# ============================================================================
name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  JOBS: 4

jobs:
  # ==========================================================================
  lint:
    name: "Lint (clang-format)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format (apt, version fijada)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format
      - name: Assert pinned version
        run: |
          want="$(sed -n 's/^set(CLANG_FORMAT_VERSION //p' versions.cmake | tr -d '"' | cut -d' ' -f1)"
          clang-format --version | grep -q "$want" \
            || { echo "clang-format no es la versión fijada ($want)" >&2; exit 1; }
      - run: make lint

  # ==========================================================================
  linux:
    name: "Linux: deps + build + tests + bundle"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Headers de la base del sistema (README, "Requisitos de build"): no
      # viajan en el bundle; son para compilar libobs y la interfaz.
      - name: Install build toolchain (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build clang patchelf \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev libxcb-xinerama0-dev \
            libxcb-composite0-dev libxcb-damage0-dev libxcb-present-dev libxcb-xkb-dev \
            libxcomposite-dev libxinerama-dev libxkbcommon-dev libxss-dev \
            libpulse-dev libasound2-dev libudev-dev \
            libwayland-dev libdrm-dev libfreetype-dev libfontconfig1-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Se guarda apenas terminan las dependencias (aunque despues falle un
      # test): la primera corrida compila FFmpeg/libobs y tarda.
      - name: Restaurar extern/ (Linux)
        id: extern-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            extern
            !extern/.build-*
          key: extern-linux-${{ hashFiles('Makefile', 'versions.cmake', 'tools/deps/obs-deps-linux.sh') }}

      - name: Dependencias (make deps-linux)
        run: |
          python -m venv .venv
          make deps-linux JOBS=$(nproc)

      - name: Guardar extern/ (Linux)
        if: steps.extern-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            extern
            !extern/.build-*
          key: ${{ steps.extern-cache.outputs.cache-primary-key }}

      - name: Build
        run: make build JOBS=$(nproc)

      # Los tests que necesitan GPU/sesion grafica devuelven 77 (saltados).
      - name: Tests C++ (ctest)
        run: make test

      - name: Tests Python (pytest)
        run: |
          .venv/bin/pip install -r requirements-dev.lock
          .venv/bin/pytest -q

      - name: Bundle portable (make dist-linux)
        run: make dist-linux JOBS=$(nproc)

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error

  # ==========================================================================
  windows:
    name: "Windows x64 (clang-cl desde Linux) + tests en Wine + bundle"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build p7zip-full
          # Solo para las herramientas de build (host) de LSP en tools/deps/lsp-win.sh:
          # no van al bundle de Windows.
          sudo apt-get install -y libsndfile1-dev libcairo2-dev libx11-dev libxrandr-dev \
            libfreetype-dev libfontconfig-dev libgl-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restaurar extern/ (Windows)
        id: extern-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            extern
            !extern/.build-*
          key: extern-win-${{ hashFiles('Makefile', 'versions.cmake', 'tools/deps/win-toolchain.sh', 'tools/deps/ndi-src.sh', 'tools/deps/lsp-win.sh', 'tools/ci/test-win.sh') }}

      # deps-win incluye el Qt del host (moc/rcc/qmlcachegen corren en Linux).
      - name: Dependencias (make deps-win)
        run: |
          python -m venv .venv
          make deps-win JOBS=$(nproc) BA_ACCEPT_MSVC_LICENSE=1

      - name: Guardar extern/ (Windows)
        if: steps.extern-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            extern
            !extern/.build-*
          key: ${{ steps.extern-cache.outputs.cache-primary-key }}

      - name: Build (make win)
        run: make win JOBS=$(nproc) BA_ACCEPT_MSVC_LICENSE=1

      - name: Tests de Windows bajo Wine (make test-win)
        run: make test-win BA_ACCEPT_MSVC_LICENSE=1

      - name: Bundle portable (make dist-win)
        run: make dist-win JOBS=$(nproc) BA_ACCEPT_MSVC_LICENSE=1

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*
          if-no-files-found: error

  # ==========================================================================
  # El nucleo es lock-free (atomic_ref sobre memoria compartida, seqlock, ring
  # SPSC): esa clase de fallo no la ve un test funcional. ASan y TSan son
  # incompatibles entre si: dos pasadas. Compila sin deps (modo headless).
  sanitizers:
    name: "Sanitizers (${{ matrix.name }})"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "asan+ubsan"
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          - name: "tsan"
            flags: "-fsanitize=thread -fno-omit-frame-pointer -g"
    steps:
      - uses: actions/checkout@v4
      - name: Configure (${{ matrix.name }})
        run: |
          cmake -S . -B build-san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" \
            -DCMAKE_C_FLAGS="${{ matrix.flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}"
      - name: Build
        run: cmake --build build-san -j"$(nproc)"
      # setarch -R: sin ASLR (TSan no soporta los bits de aleatorizacion de
      # los kernels recientes). halt_on_error: el primer hallazgo falla el job.
      - name: Test con sanitizers
        env:
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:abort_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
          TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
        run: setarch -R ctest --test-dir build-san --output-on-failure

  # ==========================================================================
  release:
    name: "Release (GitHub)"
    runs-on: ubuntu-24.04
    needs: [lint, linux, windows, sanitizers]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publicar el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            # Version del proyecto sacada del nombre del bundle (make dist-*).
            ver="$(ls dist/*-linux-x64.tar.gz | sed -E 's/.*BroadcastAppliance-(.*)-linux-x64\.tar\.gz/\1/')"
            tag="v${ver}-build.${GITHUB_RUN_NUMBER}"
          fi
          gh release create "${tag}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "${tag}" --generate-notes --latest
