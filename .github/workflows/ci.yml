# ============================================================================
# CI/CD — Broadcast Appliance Portable v2
#
# Usa los MISMOS targets de make que el desarrollo local: todo lo de terceros
# se descarga (con hash) o se compila desde fuente fijada dentro de extern/.
# extern/ se guarda en la cache de Actions (clave = hash de los pins), asi que
# solo la primera corrida compila FFmpeg/GStreamer y baja Qt/libwebrtc.
#
# Jobs:
#   1. lint        clang-format (version fijada en versions.cmake).
#   2. linux       deps completas + build + ctest + pytest + dist-linux
#                  (bundle portable verificado por check-portable.sh).
#   3. windows     cross desde Linux (clang-cl, ABI MSVC) + tests bajo Wine
#                  + dist-win (bundle verificado por check-portable-win.sh).
#   4. windows-smoke  el .zip publicado, corrido en un Windows real: nucleo,
#                  arranque del operador y motor. Es lo unico que ve los
#                  fallos que Wine tapa (el CRT de Microsoft es mas estricto).
#   5. sanitizers  ASan/UBSan y TSan sobre la suite.
#   6. release     solo si se pidio "publicar" y se lanzo sobre master: publica
#                  el .tar.gz de Linux y el .zip de Windows (con sus .sha256)
#                  en un GitHub Release, tag v<version de CMakeLists>-build.<n>.
#
# SOLO A MANO: Actions -> CI -> Run workflow. Nada corre solo en cada push ni
# en cada PR (el repo es privado: cada corrida gasta minutos del cupo). Sin
# "publicar", compila y prueba; con "publicar", ademas sale el release.
#
# Tambien se puede compilar en una maquina propia y subir de ahi, sin gastar
# nada: make publicar-linux / publicar-win (en Linux) y make publicar-macos
# (en una Mac), ver tools/publicar.sh. macOS no se compila aca (los minutos de
# Mac cuentan x10): su job completo esta en macos.yml, tambien a mano.
#
# Licencia de Microsoft: el job de Windows baja el CRT y el Windows SDK con
# xwin (BA_ACCEPT_MSVC_LICENSE=1), aceptando la licencia de Visual Studio
# Build Tools en nombre del dueño del repositorio.
# ============================================================================
name: CI

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar el release (solo sobre master)"
        type: boolean
        default: false

permissions:
  contents: read

# Artefactos en v4 a proposito: el servidor de artefactos de act (tools/ci/act.sh)
# no acepta el protocolo de upload-artifact v6; GitHub corre la v4 sobre Node 24.

# Un push nuevo a la misma rama cancela la corrida anterior (ahorra minutos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JOBS: 4

jobs:
  # ==========================================================================
  lint:
    name: "Lint (clang-format)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format (apt, version fijada)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format
      - name: Assert pinned version
        run: |
          want="$(sed -n 's/^set(CLANG_FORMAT_VERSION //p' versions.cmake | tr -d '"' | cut -d' ' -f1)"
          clang-format --version | grep -q "$want" \
            || { echo "clang-format no es la versión fijada ($want)" >&2; exit 1; }
      - run: make lint

  # ==========================================================================
  linux:
    name: "Linux: deps + build + tests + bundle"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # El runner trae ~14 GB libres y el job usa mas de 10: se borran SDKs
      # preinstalados que no se usan (Android, .NET, Haskell, CodeQL).
      - name: Liberar disco
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL || true
          df -h /

      # Headers de la base del sistema (README, "Requisitos de build"): no
      # viajan en el bundle; son para compilar GStreamer y la interfaz.
      - name: Install build toolchain (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config git curl ca-certificates rsync unzip xz-utils file \
            ccache ninja-build clang patchelf p7zip-full \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev libxcb-xinerama0-dev \
            libxcb-composite0-dev libxcb-damage0-dev libxcb-present-dev libxcb-xkb-dev \
            libxcomposite-dev libxinerama-dev libxkbcommon-dev libxss-dev \
            libxext-dev libxrender-dev libxrandr-dev \
            libpulse-dev libasound2-dev libudev-dev \
            libwayland-dev libdrm-dev libfreetype-dev libfontconfig1-dev

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Se guarda apenas terminan las dependencias (aunque despues falle un
      # test): la primera corrida compila FFmpeg/GStreamer y tarda.
      - name: Restaurar extern/ (Linux)
        id: extern-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            extern
            !extern/.build-*
          key: extern-linux-${{ hashFiles('Makefile', 'versions.cmake', 'tools/deps/terceros-linux.sh', 'tools/deps/gstreamer-linux.sh', 'tools/deps/craft.sh', 'tools/deps/fuentes-texto.sh') }}

      - name: Dependencias (make deps-linux)
        run: |
          python -m venv .venv
          make deps-linux JOBS=$(nproc)

      - name: Guardar extern/ (Linux)
        if: steps.extern-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            extern
            !extern/.build-*
          key: ${{ steps.extern-cache.outputs.cache-primary-key }}

      - name: Build
        run: make build JOBS=$(nproc)

      # Los tests que necesitan GPU/sesion grafica devuelven 77 (saltados).
      - name: Tests C++ (ctest)
        run: make test TESTS_JOBS=1

      - name: Tests Python (pytest)
        run: |
          .venv/bin/pip install -r requirements-dev.lock
          .venv/bin/pytest -q

      - name: Bundle portable (make dist-linux)
        run: make dist-linux JOBS=$(nproc)

      # Humo del bundle TAL CUAL se publica: extraido en otro lado y sin el
      # GStreamer ni las bibliotecas de terceros de extern/ (sus rutas pueden
      # quedar compiladas adentro y tapar errores de "solo anda en la maquina
      # que compilo"). Motor completo: video por GL de software (Xvfb +
      # llvmpipe), x264, AAC, RTMP y una grabacion.
      - name: Humo del bundle (autotest del motor)
        run: |
          sudo apt-get install -y xvfb libgl1-mesa-dri
          d="$RUNNER_TEMP/humo" && rm -rf "$d" && mkdir -p "$d"
          tar xzf dist/*-linux-x64.tar.gz -C "$d"
          mv extern/gstreamer-linux extern/gstreamer-linux.oculto
          mv extern/terceros-linux extern/terceros-linux.oculto
          cd "$d/BroadcastAppliance"
          HOME="$d/home" LIBGL_ALWAYS_SOFTWARE=1 timeout 300 \
            xvfb-run -a -s "-screen 0 1280x720x24" ./bin/64bit/ba-app --engine-selftest 2>&1 | tee "$d/humo.log" \
            | grep -E '^\s*\[|autotest del motor' || true
          cd "$GITHUB_WORKSPACE" && mv extern/gstreamer-linux.oculto extern/gstreamer-linux
          mv extern/terceros-linux.oculto extern/terceros-linux
          grep -q "autotest del motor: OK" "$d/humo.log" || { tail -40 "$d/humo.log"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          # Solo sirven para pasarle los archivos al release en la MISMA corrida
          # (lo publicado queda en el release): 1 dia y no los 90 de siempre, que
          # llenaban la cuota de almacenamiento de Actions.
          retention-days: 1
          name: dist-linux
          path: dist/*
          if-no-files-found: error

  # ==========================================================================
  windows:
    name: "Windows x64 (clang-cl desde Linux) + tests en Wine + bundle"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # El runner trae ~14 GB libres y el job usa mas de 10: se borran SDKs
      # preinstalados que no se usan (Android, .NET, Haskell, CodeQL).
      - name: Liberar disco
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install tools (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config git curl ca-certificates rsync unzip xz-utils file \
            ccache ninja-build p7zip-full
          # Solo para las herramientas de build (host) de LSP en tools/deps/lsp-win.sh:
          # no van al bundle de Windows.
          sudo apt-get install -y libsndfile1-dev libcairo2-dev libx11-dev libxrandr-dev \
            libfreetype-dev libfontconfig-dev libgl-dev

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restaurar extern/ (Windows)
        id: extern-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            extern
            !extern/.build-*
          key: extern-win-${{ hashFiles('Makefile', 'versions.cmake', 'tools/deps/win-toolchain.sh', 'tools/deps/ndi-src.sh', 'tools/deps/lsp-win.sh', 'tools/ci/test-win.sh', 'tools/deps/craft.sh', 'tools/deps/fuentes-texto.sh', 'tools/deps/msitools.sh') }}

      # deps-win incluye el Qt del host (moc/rcc/qmlcachegen corren en Linux).
      - name: Dependencias (make deps-win)
        run: |
          python -m venv .venv
          make deps-win JOBS=$(nproc) BA_ACCEPT_MSVC_LICENSE=1

      - name: Guardar extern/ (Windows)
        if: steps.extern-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            extern
            !extern/.build-*
          key: ${{ steps.extern-cache.outputs.cache-primary-key }}

      - name: Build (make win)
        run: make win JOBS=$(nproc) BA_ACCEPT_MSVC_LICENSE=1

      - name: Tests de Windows bajo Wine (make test-win)
        run: make test-win BA_ACCEPT_MSVC_LICENSE=1

      - name: Bundle portable (make dist-win)
        run: make dist-win JOBS=$(nproc) BA_ACCEPT_MSVC_LICENSE=1

      - uses: actions/upload-artifact@v4
        with:
          # Solo sirven para pasarle los archivos al release en la MISMA corrida
          # (lo publicado queda en el release): 1 dia y no los 90 de siempre, que
          # llenaban la cuota de almacenamiento de Actions.
          retention-days: 1
          name: dist-windows
          path: dist/*
          if-no-files-found: error

  # ==========================================================================
  # El nucleo es lock-free (atomic_ref sobre memoria compartida, seqlock, ring
  # SPSC): esa clase de fallo no la ve un test funcional. ASan y TSan son
  # incompatibles entre si: dos pasadas. Compila sin deps (modo headless).
  sanitizers:
    name: "Sanitizers (${{ matrix.name }})"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "asan+ubsan"
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          - name: "tsan"
            flags: "-fsanitize=thread -fno-omit-frame-pointer -g"
    steps:
      - uses: actions/checkout@v5
      - name: Install tools (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config git curl ca-certificates rsync unzip xz-utils file
      - name: Configure (${{ matrix.name }})
        run: |
          cmake -S . -B "build-san-${{ matrix.name }}" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" \
            -DCMAKE_C_FLAGS="${{ matrix.flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}"
      - name: Build
        run: cmake --build "build-san-${{ matrix.name }}" -j"$(nproc)"
      # setarch -R: sin ASLR (TSan no soporta los bits de aleatorizacion de
      # los kernels recientes). halt_on_error: el primer hallazgo falla el job.
      - name: Test con sanitizers
        env:
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:abort_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
          TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
        run: setarch -R ctest --test-dir "build-san-${{ matrix.name }}" --output-on-failure

  # ==========================================================================
  # El job `windows` cross-compila desde Linux y prueba bajo Wine: nadie corria
  # el bundle en un Windows de verdad. Eso dejo salir un release que no
  # arrancaba (setvbuf con size=0: valido en glibc, invalid parameter handler
  # del CRT de Microsoft -> 0xC0000409; el ucrtbase de Wine no valida). Este
  # job baja el .zip TAL CUAL se publica y lo corre en Windows.
  windows-smoke:
    name: "Humo del bundle en Windows real"
    runs-on: windows-2022
    needs: [windows]
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: dist

      - name: Verificar el .sha256 publicado
        run: |
          $zip = (Get-ChildItem dist/*-windows-x64.zip)[0]
          $want = ((Get-Content "$($zip.FullName).sha256") -split '\s+')[0]
          $got  = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $got) { throw "sha256 no coincide: $want != $got" }
          "$($zip.Name): sha256 OK"
          "BA_ZIP=$($zip.FullName)" >> $env:GITHUB_ENV

      # Fuera del workspace y sin nada del build al lado: el bundle tiene que
      # bastarse solo (es el equivalente de esconder extern/ en Linux).
      - name: Extraer el bundle
        run: |
          $d = "$env:RUNNER_TEMP\humo"
          Expand-Archive -Path $env:BA_ZIP -DestinationPath $d -Force
          # El zip trae una carpeta raiz (BroadcastAppliance\), como el .tar.gz.
          $d = "$d\BroadcastAppliance"
          "BA_DIR=$d" >> $env:GITHUB_ENV
          Get-ChildItem $d | Select-Object Name

      # 1) Nucleo sin motor de video: no necesita GPU.
      - name: "Humo: nucleo (--headless-selftest)"
        run: |
          $log = "$env:RUNNER_TEMP\headless.log"
          & "$env:BA_DIR\bin\64bit\ba-app.exe" --headless-selftest *>&1 | Tee-Object $log
          if ($LASTEXITCODE -ne 0) { throw "--headless-selftest salio con $LASTEXITCODE" }
          if (-not (Select-String -Path $log -SimpleMatch "ba-app headless: OK")) { throw "sin el OK del nucleo" }

      # 2) El camino que crasheaba: runOperate (el mismo arranque que la GUI,
      #    setvbuf incluido), con --duration para que termine solo. Ojo: los
      #    flags con valor son --clave=valor (argValue en OperateMode.cpp solo
      #    matchea el prefijo "--clave="); con un espacio el valor se ignora y
      #    el proceso corre para siempre.
      - name: "Humo: arranque del operador (--no-ui --duration=5)"
        timeout-minutes: 5
        run: |
          $log = "$env:RUNNER_TEMP\operate.log"
          & "$env:BA_DIR\bin\64bit\ba-app.exe" --no-ui --duration=5 --status-every=2 *>&1 | Tee-Object $log
          $rc = $LASTEXITCODE
          if ($rc -ne 0) {
            "exit 0x{0:X8}" -f $rc
            Get-Content $log -Tail 40
            throw "el operador no arranco (exit $rc)"
          }
          if (-not (Select-String -Path $log -SimpleMatch "cierre ordenado")) { throw "no cerro ordenado" }

      # 3) Motor completo: GStreamer, x264, AAC y una grabacion real.
      - name: "Humo: motor (--engine-selftest)"
        run: |
          $log = "$env:RUNNER_TEMP\engine.log"
          & "$env:BA_DIR\bin\64bit\ba-app.exe" --engine-selftest *>&1 | Tee-Object $log
          $rc = $LASTEXITCODE
          if (-not (Select-String -Path $log -SimpleMatch "autotest del motor: OK")) {
            "exit 0x{0:X8}" -f $rc
            Get-Content $log -Tail 60
            throw "el autotest del motor no dio OK"
          }

      - name: Logs del bundle (si algo fallo)
        if: failure()
        run: Get-ChildItem "$env:BA_DIR\Logs" -ErrorAction SilentlyContinue | ForEach-Object { "--- $($_.Name) ---"; Get-Content $_.FullName -Tail 60 }

  # ==========================================================================
  release:
    name: "Release (GitHub)"
    runs-on: ubuntu-24.04
    needs: [lint, linux, windows, windows-smoke, sanitizers]
    if: inputs.publicar && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      # Solo por las notas (packaging/notas-release.md).
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publicar el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          # Version del proyecto sacada del nombre del bundle (make dist-*).
          ver="$(ls dist/*-linux-x64.tar.gz | sed -E 's/.*BroadcastAppliance-(.*)-linux-x64\.tar\.gz/\1/')"
          tag="v${ver}-build.${GITHUB_RUN_NUMBER}"
          # Notas para quien baja el programa (arriba); el detalle tecnico de
          # los cambios lo agrega --generate-notes debajo. Las mismas que usa
          # tools/publicar.sh cuando se publica desde una maquina propia.
          cp packaging/notas-release.md notas.md
          gh release create "${tag}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "Broadcast Appliance ${tag}" --notes-file notas.md --generate-notes --latest
