# ============================================================================
# CI/CD — Broadcast Appliance Portable v2
#
# Tres jobs:
#   1. `linux`          : build nativo (ccache) + ctest (18) + pytest.
#   2. `windows-cross`  : cross-compile MinGW-w64 (x86_64) desde Ubuntu.
#   3. `release`        : solo en tags; empaqueta `make release` y lo sube.
#
# El proyecto es C++20 / CMake con un Makefile que envuelve a CMake
# (targets: build, test, dist, win). Las dependencias de terceros entran
# por FetchContent, así el configure descarga lo que necesita solo.
# ============================================================================
name: CI

# --- Disparadores -----------------------------------------------------------
#   - push a `master`: CI de integración en la rama protegida.
#   - pull_request: CI de verificación antes de mergear.
on:
  push:
    branches: [master]
  pull_request:

# --- Permisos mínimos -------------------------------------------------------
# Solo lectura de contenido: el workflow no publica releases ni paquetes.
permissions:
  contents: read

jobs:
  # ==========================================================================
  # JOB 1 — LINUX: build nativo + pruebas C++ (ctest) + pruebas Python
  # ==========================================================================
  linux:
    name: "Linux: build + ctest + pytest"
    runs-on: ubuntu-latest

    steps:
      # --- Checkout del código ---------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --- Herramientas de build -------------------------------------------
      # ccache acelera las recompilaciones incrementales entre runs.
      # En CI es apt-get (no es un host de desarrollo, no aplica la regla
      # de "sin installs globales" del workspace).
      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      # --- Python 3.12 + venv local ----------------------------------------
      # El proyecto usa un venv local (`.venv/`) con `requirements-dev.lock`.
      # El lockfile pinna pytest y sus dependencias transitivas a versiones
      # exactas, así `pytest` corre igual que en dev.
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Create venv + install dev requirements
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.lock

      # --- Build nativo (usa ccache) ---------------------------------------
      # `make build` envuelve a CMake; el Makefile ya apunta el compilador
      # a ccache, así que no hay que configurar nada extra.
      - name: Build (make build)
        run: make build

      # --- Pruebas C++ (ctest) ---------------------------------------------
      # `make test` ejecuta ctest; se esperan 18/18.
      - name: Test C++ (make test / ctest)
        run: make test

      # --- Pruebas Python (pytest) -----------------------------------------
      # Usamos el venv local para que las dependencias sean idénticas a dev.
      - name: Test Python (pytest)
        run: .venv/bin/pytest -q

  # ==========================================================================
  # JOB 2 — WINDOWS CROSS: cross-compile MinGW-w64 (x86_64) desde Ubuntu
  # ==========================================================================
  # Espeja el cross-build MinGW verificado: CMAKE_SYSTEM_NAME=Windows con
  # los binarios x86_64-w64-mingw32 (gcc/g++/windres).
  windows-cross:
    name: "Windows cross (MinGW-w64 x86_64)"
    runs-on: ubuntu-latest

    steps:
      # --- Checkout del código ---------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --- Herramienta de cross-compilación --------------------------------
      # mingw-w64 trae gcc/g++/windres con el prefijo x86_64-w64-mingw32.
      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      # --- Cross-configure + build -----------------------------------------
      # Configuramos CMake para Windows con el toolchain MinGW y compilamos
      # en `build/win` (dentro del root de build, aislado por subdirectorio).
      - name: Cross-configure (CMake, MinGW)
        run: |
          cmake -S . -B build/win \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_BUILD_TYPE=Release

      - name: Cross-build
        run: cmake --build build/win --config Release -j"$(nproc)"

      # --- Confirmar artefactos --------------------------------------------
      # El cross-build es COMPLETO: el CMakeLists raíz añade los 5
      # subdirectorios sin guardas de plataforma, así que `cmake --build`
      # compila los 5 targets de producto. Afirmamos la existencia exacta de
      # los 5 artefactos (no solo "algún .exe/.dll"): si falta alguno, el
      # configure o el build falló para ese target.
      #   ba-app           -> .exe   (Proceso A, GUI)
      #   ba-gateway       -> .exe   (Proceso B)
      #   ba-sources       -> .dll   (módulo libobs, SHARED)
      #   ba_plugin_host   -> .a     (host VST3, STATIC)
      #   BroadcastAppliance -> .exe (Proceso 0, launcher)
      - name: Verify artifacts
        run: |
          artifacts=(
            "build/win/src/app/ba-app.exe"
            "build/win/src/gateway/ba-gateway.exe"
            "build/win/src/obs-module/libba-sources.dll"
            "build/win/src/plugin-host/libba_plugin_host.a"
            "build/win/src/launcher/BroadcastAppliance.exe"
          )
          echo "Verificando los 5 artefactos de producto (cross-build MinGW):"
          missing=0
          for a in "${artifacts[@]}"; do
            if [ -f "$a" ]; then
              echo "  OK     $a"
            else
              echo "  FALTA  $a" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "ERROR: faltan artefactos de producto tras el cross-build" >&2
            exit 1
          fi
          echo "Los 5 artefactos de producto existen."

  # ==========================================================================
  # JOB 3 — RELEASE: empaquetado portable (solo en tags)
  # ==========================================================================
  # Corre solo cuando el ref es una tag (refs/tags/*) y depende de que el
  # job `linux` haya pasado (build + tests verdes).
  release:
    name: "Release (portable bundle)"
    runs-on: ubuntu-latest
    needs: linux
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      # --- Checkout del código ---------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --- Herramientas de build -------------------------------------------
      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      # --- Empaquetado portable --------------------------------------------
      # `make release` produce el bundle portable en `release`.
      - name: Build portable bundle (make release)
        run: make release

      # --- Subir el bundle como artifact -----------------------------------
      - name: Upload portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: portable-bundle
          path: release
          if-no-files-found: error
