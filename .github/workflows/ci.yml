# ============================================================================
# CI/CD — Broadcast Appliance Portable v2
#
# Cinco jobs:
#   1. `linux`          : build nativo (ccache) + ctest + pytest.
#   2. `windows-cross`  : cross-compile MinGW-w64 (x86_64) desde Ubuntu.
#   3. `lint`           : clang-format con la version fijada en versions.cmake.
#   4. `sanitizers`     : ASan/UBSan y TSan sobre la suite (el nucleo es
#                         lock-free; esa clase de fallo no la ve un test
#                         funcional).
#   5. `release`        : solo en tags; empaqueta `make release` y lo sube.
#                         Depende de los cuatro anteriores.
#
# El proyecto es C++20 / CMake con un Makefile que envuelve a CMake
# (targets: build, test, dist, win). Las dependencias de terceros entran
# por FetchContent, así el configure descarga lo que necesita solo.
# ============================================================================
name: CI

# --- Disparadores -----------------------------------------------------------
#   - push a `master`: CI de integración en la rama protegida.
#   - pull_request: CI de verificación antes de mergear.
on:
  push:
    branches: [master]
  pull_request:

# --- Permisos mínimos -------------------------------------------------------
# Solo lectura de contenido: el workflow no publica releases ni paquetes.
permissions:
  contents: read

jobs:
  # ==========================================================================
  # JOB 1 — LINUX: build nativo + pruebas C++ (ctest) + pruebas Python
  # ==========================================================================
  linux:
    name: "Linux: build + ctest + pytest"
    runs-on: ubuntu-latest

    steps:
      # --- Checkout del código ---------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --- Herramientas de build -------------------------------------------
      # ccache acelera las recompilaciones incrementales entre runs.
      # En CI es apt-get (no es un host de desarrollo, no aplica la regla
      # de "sin installs globales" del workspace).
      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      # --- Python 3.12 + venv local ----------------------------------------
      # El proyecto usa un venv local (`.venv/`) con `requirements-dev.lock`.
      # El lockfile pinna pytest y sus dependencias transitivas a versiones
      # exactas, así `pytest` corre igual que en dev.
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Create venv + install dev requirements
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.lock

      # --- Build nativo (usa ccache) ---------------------------------------
      # `make build` envuelve a CMake; el Makefile ya apunta el compilador
      # a ccache, así que no hay que configurar nada extra.
      - name: Build (make build)
        run: make build

      # --- Pruebas C++ (ctest) ---------------------------------------------
      # `make test` ejecuta ctest. Los tests que no pueden correr en este
      # entorno (sin libwebrtc, sin libobs) devuelven 77 y ctest los reporta
      # como "skipped", no como aprobados.
      - name: Test C++ (make test / ctest)
        run: make test

      # --- Pruebas Python (pytest) -----------------------------------------
      # Usamos el venv local para que las dependencias sean idénticas a dev.
      - name: Test Python (pytest)
        run: .venv/bin/pytest -q

  # ==========================================================================
  # JOB 2 — WINDOWS CROSS: cross-compile MinGW-w64 (x86_64) desde Ubuntu
  # ==========================================================================
  # Espeja el cross-build MinGW verificado: CMAKE_SYSTEM_NAME=Windows con
  # los binarios x86_64-w64-mingw32 (gcc/g++/windres).
  windows-cross:
    name: "Windows cross (MinGW-w64 x86_64)"
    runs-on: ubuntu-latest

    steps:
      # --- Checkout del código ---------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --- Herramienta de cross-compilación --------------------------------
      # mingw-w64 trae gcc/g++/windres con el prefijo x86_64-w64-mingw32.
      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      # --- Cross-configure + build -----------------------------------------
      # Configuramos CMake para Windows con el toolchain MinGW y compilamos
      # en `build/win` (dentro del root de build, aislado por subdirectorio).
      - name: Cross-configure (CMake, MinGW)
        run: |
          cmake -S . -B build/win \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_BUILD_TYPE=Release

      - name: Cross-build
        run: cmake --build build/win --config Release -j"$(nproc)"

      # --- Confirmar artefactos --------------------------------------------
      # El cross-build es COMPLETO: el CMakeLists raíz añade los 5
      # subdirectorios sin guardas de plataforma, así que `cmake --build`
      # compila los 5 targets de producto. Afirmamos la existencia exacta de
      # los 5 artefactos (no solo "algún .exe/.dll"): si falta alguno, el
      # configure o el build falló para ese target.
      #   ba-app           -> .exe   (Proceso A, GUI)
      #   ba-gateway       -> .exe   (Proceso B)
      #   ba-sources       -> .dll   (módulo libobs, SHARED)
      #   ba_plugin_host   -> .a     (host VST3, STATIC)
      #   BroadcastAppliance -> .exe (Proceso 0, launcher)
      - name: Verify artifacts
        run: |
          artifacts=(
            "build/win/src/app/ba-app.exe"
            "build/win/src/gateway/ba-gateway.exe"
            "build/win/src/obs-module/libba-sources.dll"
            "build/win/src/plugin-host/libba_plugin_host.a"
            "build/win/src/launcher/BroadcastAppliance.exe"
          )
          echo "Verificando los 5 artefactos de producto (cross-build MinGW):"
          missing=0
          for a in "${artifacts[@]}"; do
            if [ -f "$a" ]; then
              echo "  OK     $a"
            else
              echo "  FALTA  $a" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "ERROR: faltan artefactos de producto tras el cross-build" >&2
            exit 1
          fi
          echo "Los 5 artefactos de producto existen."

  # ==========================================================================
  # JOB 4 — LINT: formato de código con clang-format
  # ==========================================================================
  # El formato solo es determinista si el binario de clang-format es
  # EXACTAMENTE el mismo en CI y en dev. Para eso la versión va FIJADA en
  # versions.cmake (CLANG_FORMAT_VERSION) y este job corre con `runs-on`
  # FIJADO a ubuntu-24.04 (noble): ahí `apt install clang-format-18` da
  # exactamente esa versión (la misma que se instala en el host de dev). Si
  # `ubuntu-latest` cambia de distro en el futuro, el pin de `runs-on`
  # mantiene la versión estable.
  lint:
    name: "Lint (clang-format, apt)"
    runs-on: ubuntu-24.04

    steps:
      # --- Checkout del código ---------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --- clang-format por apt (versión fijada) ----------------------------
      # `clang-format-18` es el paquete versionado de noble (18.1.3). El
      # symlink en /usr/local/bin deja `clang-format` en el PATH para que
      # `make lint` lo encuentre sin cambios.
      - name: Install clang-format (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format
          clang-format --version

      # --- Asertar la versión fijada ----------------------------------------
      # Si noble cambia la versión del paquete, el job falla aquí (no con un
      # diff de formato misterioso).
      - name: Assert pinned version
        run: |
          want="$(sed -n 's/^set(CLANG_FORMAT_VERSION //p' versions.cmake | tr -d '"' | cut -d' ' -f1)"
          clang-format --version | grep -q "$want" \
            || { echo "clang-format no es la versión fijada ($want)" >&2; exit 1; }

      # --- Lint (make lint) --------------------------------------------------
      # El target del Makefile corre `clang-format --dry-run -Werror` sobre
      # src/ con el .clang-format del repo. Si hay diffs, el job falla y el
      # log muestra los archivos.
      - name: Lint (make lint)
        run: make lint

  # ==========================================================================
  # JOB 5 — SANITIZERS: ASan/UBSan y TSan sobre la suite de ba_core
  # ==========================================================================
  # El nucleo es lock-free: `std::atomic_ref` sobre memoria compartida, un
  # seqlock escrito a mano, un ring SPSC y un automixer que cruza el hilo de
  # audio con el de control. Esa clase de codigo falla de forma no determinista
  # y los tests funcionales no la detectan: hicieron falta sanitizers para ver
  # una fuga y varias carreras que llevaban meses en el arbol.
  #
  # Se corren en dos pasadas porque ASan y TSan son incompatibles entre si.
  sanitizers:
    name: "Sanitizers (${{ matrix.name }})"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "asan+ubsan"
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          - name: "tsan"
            flags: "-fsanitize=thread -fno-omit-frame-pointer -g"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (${{ matrix.name }})
        run: |
          cmake -S . -B build-san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" \
            -DCMAKE_C_FLAGS="${{ matrix.flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}"

      - name: Build
        run: cmake --build build-san -j"$(nproc)"

      # `halt_on_error=1` para que el primer hallazgo falle el job en vez de
      # quedar sepultado en el log.
      #
      # `setarch -R` desactiva el ASLR del proceso: los kernels recientes usan
      # mas bits de aleatorizacion (vm.mmap_rnd_bits) de los que ThreadSanitizer
      # soporta, y sin esto TSan aborta con "unexpected memory mapping" antes de
      # ejecutar un solo test. Es inofensivo para ASan y evita tener que tocar
      # sysctl con sudo en el runner.
      - name: Test con sanitizers
        env:
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:abort_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
          TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
        run: setarch -R ctest --test-dir build-san --output-on-failure

  # ==========================================================================
  # JOB 3 — RELEASE: empaquetado portable (solo en tags)
  # ==========================================================================
  # Corre solo cuando el ref es una tag (refs/tags/*) y depende de que el
  # job `linux` haya pasado (build + tests verdes).
  release:
    name: "Release (portable bundle)"
    runs-on: ubuntu-latest
    # Depende de TODOS los jobs de verificacion, no solo del build nativo: con
    # `needs: linux` a secas se podia publicar un bundle con el cross-build
    # roto, el formato sin pasar o un sanitizer en rojo.
    needs: [linux, windows-cross, lint, sanitizers]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      # --- Checkout del código ---------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --- Herramientas de build -------------------------------------------
      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      # --- Empaquetado portable --------------------------------------------
      # `make release` produce el bundle portable en `release`.
      - name: Build portable bundle (make release)
        run: make release

      # --- Subir el bundle como artifact -----------------------------------
      - name: Upload portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: portable-bundle
          path: release
          if-no-files-found: error
