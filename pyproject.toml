# Config-only metadata for the broadcast-appliance repo-invariant pytest suite.
# No [build-system] on purpose: this file is not a package, it only carries
# project metadata and pytest configuration.

[project]
name = "broadcast-appliance"
version = "2.0.0"
description = "Repo-invariant pytest suite for the broadcast-appliance C++20 broadcast appliance"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
