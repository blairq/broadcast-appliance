<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Broadcast Appliance">
  <!-- El chasis: un equipo de rack, esquinas redondeadas y frente oscuro. -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#15191c"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="51.5" fill="none" stroke="#2c3438" stroke-width="1"/>

  <!-- La pantalla del programa: lo que sale al aire. -->
  <rect x="48" y="68" width="160" height="94" rx="10" fill="#e9edee"/>
  <rect x="48" y="68" width="160" height="94" rx="10" fill="none" stroke="#39434a" stroke-width="2"/>

  <!-- El tally: rojo y arriba a la derecha, donde se lo busca. -->
  <circle cx="196" cy="80" r="17" fill="#15191c"/>
  <circle cx="196" cy="80" r="11" fill="#e0483a"/>

  <!-- Los medidores de audio: tres barras, la del medio mas alta. -->
  <rect x="80" y="186" width="18" height="30" rx="4" fill="#3d474d"/>
  <rect x="119" y="176" width="18" height="40" rx="4" fill="#4fbfae"/>
  <rect x="158" y="192" width="18" height="24" rx="4" fill="#3d474d"/>
</svg>
