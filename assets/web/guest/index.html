<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <title>Conferencia — Invitado</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ================================================================
       App web del invitado (spec §8.3): mobile-first, en español.
       Flujo:
         1. Pantalla de entrada: sala + PIN → POST /api/join → token.
         2. Chequeo de cámara/micrófono con medidor de nivel.
         3. Conexión WebSocket /ws?token=..&slot=1 (señalización WebRTC).
         4. getUserMedia (máx 720p30) + RTCPeerConnection (offerer).
         5. Retorno: video de programa + audio de la sala.
         6. Reconexión automática con backoff; indicador "estás al aire".
       Los mensajes de señalización viajan como frames binarios WS que
       cargan el encoding Frame (4 bytes LE + JSON, spec §4.1).
       ================================================================ -->

  <!-- Pantalla de entrada (sala + PIN) -->
  <section id="screen-join" class="screen">
    <div class="card">
      <h1>Conferencia</h1>
      <p class="sub">Ingresa con la sala y el PIN que te dio el operador.</p>
      <label for="room">Sala</label>
      <input id="room" type="text" autocomplete="off" placeholder="sala1" />
      <label for="pin">PIN</label>
      <input id="pin" type="password" inputmode="numeric" placeholder="••••" />
      <button id="btn-join" class="primary">Entrar</button>
      <p id="join-error" class="error" role="alert"></p>
    </div>
  </section>

  <!-- Pantalla de chequeo de dispositivos -->
  <section id="screen-check" class="screen hidden">
    <div class="card">
      <h2>Prepara tus dispositivos</h2>
      <p class="sub">Recomendado: usá auriculares para evitar el eco.</p>
      <div class="media-grid">
        <div class="media-box">
          <video id="local-preview" class="preview" autoplay muted playsinline></video>
          <span class="badge" id="cam-state">Cámara</span>
        </div>
        <div class="media-box">
          <div class="meter-wrap">
            <div class="meter"><div id="level" class="level"></div></div>
          </div>
          <span class="badge" id="mic-state">Micrófono</span>
        </div>
      </div>
      <p id="check-error" class="error" role="alert"></p>
      <button id="btn-start" class="primary" disabled>Conectar a la sala</button>
    </div>
  </section>

  <!-- Pantalla de sala (en vivo) -->
  <section id="screen-room" class="screen hidden">
    <header class="room-head">
      <div class="status" id="conn-state">Conectando…</div>
      <div class="onair hidden" id="onair">● Estás al aire</div>
    </header>
    <div class="stage">
      <!-- Retorno: video de programa (A→B→invitado) -->
      <div class="tile program-tile">
        <video id="remote-video" class="remote" autoplay playsinline></video>
        <span class="tile-label">Programa</span>
      </div>
      <!-- Retorno: audio de la sala (A→B→invitado) -->
      <audio id="remote-audio" autoplay></audio>
    </div>
    <footer class="room-foot">
      <button id="btn-mute" class="ghost">Silenciar mic</button>
      <button id="btn-cam" class="ghost">Apagar cámara</button>
      <button id="btn-leave" class="ghost danger">Salir</button>
    </footer>
  </section>

  <script src="app.js"></script>
</body>
</html>
