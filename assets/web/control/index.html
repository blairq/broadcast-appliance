<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#22252c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Control</title>
  <link rel="apple-touch-icon" href="/comun/icono-180.png" />
  <link rel="stylesheet" href="/comun/neuro/temas.css" />
  <link rel="stylesheet" href="/comun/neuro/neuro.css" />
  <link rel="stylesheet" href="control.css" />
  <script src="/comun/neuro/neuro.js"></script>
</head>
<body>
  <!--
    El dashboard web (docs/planes/PLAN-WEB-CONTROL.md §3): /control/.

    La primera vez se abre desde el QR de la app (/control/#p=<código>): el código va
    en el FRAGMENTO (no viaja ni queda en registros). Una persona aprueba el aparato en
    la app y le pone un perfil (qué puede manejar); el aparato guarda su token y lo manda
    en el primer mensaje del WebSocket (/ws?control), nunca en la URL.

    Cada tarjeta mira sus temas (la app empuja el estado cuando cambia) y llama
    herramientas de la app; las que cortan el aire piden confirmación acá. Con
    #tarjeta=<id> se muestra UNA tarjeta a pantalla completa (lo que abre ⤢ en una
    pestaña nueva).
  -->
  <header class="barra">
    <span class="marca"><span class="punto-marca"></span><strong>Control</strong></span>
    <span id="aparato" class="suave"></span>
    <ba-tally id="tally" estado="nada" etiqueta="Fuera del aire"></ba-tally>
    <span class="espacio"></span>
    <ba-chip id="conexion" estado="apagado">Desconectado</ba-chip>
    <ba-boton id="botonTarjetas" compacto title="Qué tarjetas mostrar">▦ Tarjetas</ba-boton>
    <ba-boton id="botonCompleta" compacto redondo title="Pantalla completa">⤢</ba-boton>
  </header>

  <main id="tablero" class="tablero"></main>

  <!-- Qué tarjetas mostrar (se guarda en el aparato). -->
  <section id="menuTarjetas" class="menu-tarjetas panel oculto"></section>

  <!-- Emparejar este aparato. -->
  <section id="emparejar" class="cubre oculto">
    <div class="caja panel">
      <h1>Emparejar este aparato</h1>
      <p id="emparejarTexto" class="suave">Poné un nombre para reconocerlo y pedí el emparejamiento. Una persona lo aprueba en la app.</p>
      <input id="nombre" type="text" maxlength="60" placeholder="Ej.: iPad de dirección" />
      <ba-boton id="pedir" variante="acento" grande>Pedir emparejamiento</ba-boton>
    </div>
  </section>

  <!-- Mensajes (sin token, rechazado, sin conexión). -->
  <section id="mensaje" class="cubre oculto">
    <div class="caja panel">
      <h1 id="mensajeTitulo"></h1>
      <p id="mensajeTexto" class="suave"></p>
      <ba-boton id="olvidar" class="oculto">Olvidar este aparato</ba-boton>
    </div>
  </section>

  <!-- Confirmar lo que corta el aire. -->
  <section id="confirmar" class="cubre oculto">
    <div class="caja panel confirmar">
      <h2 id="confirmarTexto">Cambia el aire</h2>
      <div class="fila">
        <ba-boton id="confirmarNo" class="lleno">Cancelar</ba-boton>
        <ba-boton id="confirmarSi" variante="aire" class="lleno">Sí, hacelo</ba-boton>
      </div>
    </div>
  </section>

  <div id="aviso" class="aviso oculto"></div>

  <script src="tarjetas.js"></script>
  <script src="control.js"></script>
</body>
</html>
