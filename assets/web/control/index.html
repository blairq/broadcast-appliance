<!doctype html>
<html lang="es" data-ev="control">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#22252c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title data-i18n="Control">Control</title>
  <link rel="apple-touch-icon" href="/comun/icono-180.png" />
  <link rel="stylesheet" href="/comun/neuro/temas.css" />
  <link rel="stylesheet" href="/comun/neuro/neuro.css" />
  <link rel="stylesheet" href="control.css" />
  <link rel="stylesheet" href="/comun/tema.css" />
  <script src="/comun/i18n.js"></script>
  <script src="/comun/tema.js"></script>
  <script src="/comun/neuro/neuro.js"></script>
</head>
<body>
  <!--
    El dashboard web (docs/planes/PLAN-WEB-CONTROL.md §3): /control/.

    La primera vez se abre desde el QR de la app (/control/#p=<código>): el código va
    en el FRAGMENTO (no viaja ni queda en registros). Una persona aprueba el aparato en
    la app y le pone un perfil (qué puede manejar); el aparato guarda su token y lo manda
    en el primer mensaje del WebSocket (/ws?control), nunca en la URL.

    Cada tarjeta mira sus temas (la app empuja el estado cuando cambia) y llama
    herramientas de la app; las que cortan el aire piden confirmación acá. Con varias
    salidas, el aparato maneja una (el selector de arriba o la tarjeta «Salidas»): lo
    que llama va a esa y lo que miran las tarjetas es de esa. Con
    #tarjeta=<id> se muestra UNA tarjeta a pantalla completa (lo que abre ⤢ en una
    pestaña nueva).
  -->
  <header class="barra">
    <span class="marca"><span class="punto-marca"></span><strong data-i18n="Control">Control</strong></span>
    <span id="aparato" class="suave"></span>
    <ba-tally id="tally" estado="nada" etiqueta="Fuera del aire"></ba-tally>
    <!-- La salida que maneja este aparato (con su color), si hay varias: lo que llama y lo que miran las tarjetas es de esa. -->
    <select id="salida" class="salida oculto" title="Qué salida maneja este aparato" data-i18n-title="Qué salida maneja este aparato"></select>
    <span class="espacio"></span>
    <ba-chip id="conexion" estado="apagado" data-i18n="Desconectado">Desconectado</ba-chip>
    <ba-boton id="botonTarjetas" compacto title="Qué tarjetas mostrar" data-i18n-title="Qué tarjetas mostrar" data-i18n="▦ Tarjetas">▦ Tarjetas</ba-boton>
    <ba-boton id="botonCompleta" compacto redondo title="Pantalla completa" data-i18n-title="Pantalla completa">⤢</ba-boton>
  </header>

  <!-- Alarmas de la app que no dependen de su interfaz (la interfaz trabada con aire): quedan
       a la vista hasta que la app avisa que terminó. -->
  <div id="alarmaSistema" class="alarma-sistema oculto" role="alert"><strong></strong> <span></span></div>

  <main id="tablero" class="tablero"></main>

  <!-- Qué tarjetas mostrar (se guarda en el aparato). -->
  <section id="menuTarjetas" class="menu-tarjetas panel oculto"></section>

  <!-- Emparejar, los mensajes, confirmar lo que corta el aire y los avisos: las capas
       las arma conexion.js (las comparten las superficies de /control/). -->

  <script src="tarjetas/comun.js"></script>
  <script src="conexion.js"></script>
  <script src="linea.js"></script>
  <script src="tarjetas/escenas.js"></script>
  <script src="tarjetas/linea.js"></script>
  <script src="tarjetas/ptz.js"></script>
  <script src="tarjetas/mezclador.js"></script>
  <script src="tarjetas/salidas.js"></script>
  <script src="tarjetas/graficos.js"></script>
  <script src="tarjetas/sala.js"></script>
  <script src="tarjetas/oradores.js"></script>
  <script src="tarjetas/prompter.js"></script>
  <script src="tarjetas/latencias.js"></script>
  <script src="tarjetas/estado.js"></script>
  <script src="control.js"></script>
</body>
</html>
