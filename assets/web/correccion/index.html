<!doctype html>
<html lang="es" data-ev="control">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#22252c" />
  <title data-i18n="Corrección de subtítulos">Corrección de subtítulos</title>
  <link rel="apple-touch-icon" href="/comun/icono-180.png">
  <link rel="stylesheet" href="/comun/neuro/temas.css" />
  <link rel="stylesheet" href="/comun/neuro/neuro.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="/comun/tema.css" />
  <script src="/comun/i18n.js"></script>
  <script src="/comun/tema.js"></script>
  <script src="/comun/neuro/neuro.js"></script>
</head>
<body>
  <!--
    El puesto del corrector de subtítulos (T44): /correccion/#k=<clave>.
    La app retiene cada frase que transcribe la voz unos segundos antes de que
    salga al aire; acá se ven con su cuenta regresiva y se aprueban (Enter),
    se corrigen (escribir y Enter) o se descartan (Esc). Si nadie toca nada,
    salen solas cuando se termina el tiempo.
  -->
  <header>
    <img class="logo" data-tema-logo alt="" hidden />
    <div>
      <h1><span data-i18n="Subtítulos">Subtítulos</span> <span id="estado" class="estado" data-i18n="conectando…">conectando…</span></h1>
      <p class="ayuda" data-i18n="Enter aprueba (con lo que escribiste) · Esc descarta · ↑ ↓ cambian de frase">Enter aprueba (con lo que escribiste) · Esc descarta · ↑ ↓ cambian de frase</p>
    </div>
  </header>
  <main id="lista" class="lista"></main>
  <p id="vacio" class="vacio" data-i18n="No hay frases esperando.">No hay frases esperando.</p>
  <script src="app.js"></script>
</body>
</html>
