<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Componentes de control</title>
  <link rel="stylesheet" href="temas.css" />
  <link rel="stylesheet" href="neuro.css" />
  <script src="neuro.js"></script>
  <style>
    body { padding: 28px clamp(16px, 4vw, 40px) 60px; }
    header.pagina { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
    .escenas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .mezclador { display: flex; gap: 8px; justify-content: space-between; overflow-x: auto; padding: 6px 2px 4px; }
    .canal { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .ptz { display: flex; gap: 26px; align-items: center; flex-wrap: wrap; justify-content: center; }
    .perillas { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .lista { display: flex; flex-direction: column; gap: 16px; }
    .salida { display: flex; align-items: center; gap: 14px; }
    .salida .numero { font-size: 22px; }
    .vista { aspect-ratio: 16/9; border-radius: var(--radio-chico); display: grid; place-items: center; color: var(--texto-tenue); margin-bottom: 14px; }
  </style>
</head>
<body>
  <header class="pagina">
    <h1>Componentes de control</h1>
    <ba-chip estado="ok">Conectado</ba-chip>
    <ba-tally estado="aire"></ba-tally>
    <span class="espacio"></span>
    <span class="suave">Tema</span>
    <ba-tema></ba-tema>
  </header>

  <div class="grilla" style="--min: 340px">
    <ba-tarjeta titulo="Escenas" ampliar="?tarjeta=escenas">
      <div class="vista hundido-suave panel hundido">Programa</div>
      <div class="escenas">
        <ba-boton activo variante="aire">Orador</ba-boton>
        <ba-boton activo variante="armado">Plano general</ba-boton>
        <ba-boton>Debate</ba-boton>
        <ba-boton>Remoto</ba-boton>
        <ba-boton>Placa</ba-boton>
        <ba-boton>Cierre</ba-boton>
      </div>
      <div class="fila" style="margin-top: 16px">
        <ba-boton grande variante="aire" confirmar="¿Cortar?" style="flex: 1">CORTE</ba-boton>
        <ba-boton grande variante="acento" style="flex: 1">AUTO</ba-boton>
      </div>
    </ba-tarjeta>

    <ba-tarjeta titulo="Cámara PTZ" ampliar="?tarjeta=ptz">
      <ba-boton slot="acciones" compacto>Cámara 1 ▾</ba-boton>
      <div class="ptz">
        <ba-joystick id="joy"></ba-joystick>
        <div class="perillas">
          <ba-perilla etiqueta="Zoom" min="1" max="10" valor="2.5" paso="0.1" defecto="1" unidad="×"></ba-perilla>
          <ba-perilla etiqueta="Velocidad" min="0" max="100" valor="60" defecto="50" unidad="%"></ba-perilla>
        </div>
      </div>
      <p class="suave numero" id="joyTexto" style="text-align:center; margin: 14px 0 0">x 0.00 · y 0.00</p>
    </ba-tarjeta>

    <ba-tarjeta titulo="Mezclador" ampliar="?tarjeta=audio" style="grid-column: span 2">
      <div class="mezclador" id="mezclador"></div>
    </ba-tarjeta>

    <ba-tarjeta titulo="Salidas" ampliar="?tarjeta=salidas">
      <div class="lista">
        <div class="salida"><ba-chip estado="aire">YouTube</ba-chip><span class="espacio"></span><span class="numero">6 012</span><span class="suave">kbps</span></div>
        <div class="salida"><ba-chip estado="apagado">Grabación</ba-chip><span class="espacio"></span><ba-boton compacto variante="aire" confirmar="¿Grabar?">⏺ Grabar</ba-boton></div>
        <ba-slider etiqueta="Bitrate" min="1000" max="12000" paso="500" valor="6000" unidad="kbps"></ba-slider>
      </div>
    </ba-tarjeta>

    <ba-tarjeta titulo="Ajustes">
      <div class="lista">
        <ba-toggle encendido etiqueta="Subtítulos en vivo"></ba-toggle>
        <ba-toggle etiqueta="Mute general"></ba-toggle>
        <ba-slider etiqueta="Latencia del estudio" min="0" max="500" paso="10" valor="180" unidad="ms"></ba-slider>
        <input type="text" placeholder="Un campo de texto" />
        <div class="fila"><ba-boton mantener id="ptt">🎙 Mantener para hablar</ba-boton><ba-boton redondo>⚙</ba-boton></div>
      </div>
    </ba-tarjeta>
  </div>

  <script>
    // Los canales del mezclador, con niveles de mentira (para ver los vúmetros andando).
    const canales = ["Mic 1", "Mic 2", "Atril", "Invitado", "Música", "Video", "Master"];
    const mez = document.getElementById("mezclador");
    const faders = canales.map((n, i) => {
      const c = document.createElement("div");
      c.className = "canal";
      c.innerHTML = `<ba-fader etiqueta="${n}" valor="${i === 6 ? 0 : -6 - i}" style="--alto-fader: 200px"></ba-fader>
                     <ba-boton compacto ${i === 3 ? "activo variante=\"aire\"" : ""}>M</ba-boton>`;
      mez.append(c);
      return c.querySelector("ba-fader");
    });
    let t = 0;
    setInterval(() => {
      t += 0.07;
      faders.forEach((f, i) => {
        const base = -28 + 14 * Math.sin(t * (0.8 + i * 0.13) + i) + Math.random() * 6;
        f.nivel = { rms: base, pico: base + 4 + Math.random() * 3 };
      });
    }, 66);
    document.getElementById("joy").addEventListener("mover", (e) => {
      document.getElementById("joyTexto").textContent = `x ${e.detail.x.toFixed(2)} · y ${e.detail.y.toFixed(2)}`;
    });
    document.getElementById("joy").addEventListener("soltar", () => { document.getElementById("joyTexto").textContent = "x 0.00 · y 0.00"; });
  </script>
</body>
</html>
