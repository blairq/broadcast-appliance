<body>
  <!--
    Los rótulos desde el celular (/rotulos/#k=<clave>).

    La clave va en el FRAGMENTO del enlace: no viaja en la petición ni queda
    en los registros de ningún servidor por el que pase. Sin clave, la API no
    contesta ni para mirar: un rótulo suele llevar el nombre del invitado que
    todavía no se anunció.

    Esta página no dibuja nada: escribe en un buzón del gateway que la app
    viene a vaciar una vez por segundo. Por eso un botón dice «mandado» y no
    «al aire»: lo que sale al aire lo decide la app.
  -->
  <header class="barra">
    <span id="escena" class="escena">…</span>
    <span id="estado" class="estado"></span>
  </header>

  <main id="lista" class="lista"></main>

  <div id="pin" class="pin hidden">
    <div class="caja">
      <h1 data-i18n="Rótulos">Rótulos</h1>
      <p id="pinMsg" data-i18n="Este enlace no trae la clave. Pedile al operador el QR o el enlace completo.">Este enlace no trae la clave. Pedile al operador el QR o el enlace completo.</p>
      <input id="pinCampo" type="password" inputmode="numeric" placeholder="Clave" data-i18n-placeholder="Clave" autocomplete="off" />
      <button id="pinOk" data-i18n="Entrar">Entrar</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
